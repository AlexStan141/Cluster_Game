<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>Add space dimensions!</h1>
        <form id="dimensions_form">
            <label>
                Width
                <input type="number" name="width" min="1" max="7" value="2" id="width">
            </label>
            <label>
                Height
                <input type="number" name="height" min="1" max="7" value="2" id="height">
            </label>
            <button type="submit">Submit dimensions</button>
        </form>
    </div>

    <div id="content_form">
        <h1>Next add cells content!</h1>
    </div>

    <div id="table">
        <h1>Select a cell to identify the cluster!</h1>
    </div>

    <script src="./index.js"></script>
</body>
</html>
