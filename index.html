<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>Document</title>
</head>
<body>
    <table>
        <tbody>
            <tr>
                <td data-x="0" data-y="0">1</td>
                <td data-x="1" data-y="0">1</td>
            </tr>
            <tr>
                <td data-x="0" data-y="1">1</td>
                <td data-x="1" data-y="1">2</td>
            </tr>
        </tbody>
    </table>

    <div class="container">
        <form>
            <label>
                Width
                <input type="number" name="width" min="1" max="7" value="2" id="width">
            </label>
            <label>
                Height
                <input type="number" name="height" min="1" max="7" value="2" id="height">
            </label>
            <button type="submit">Submit dimensions</button>
        </form>

        <div id="zone">
            <table id="zone_table">
                <tr>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <td></td>
                    <td></td>
                </tr>
            </table>
        </div>

    </div>

    <script src="./index.js"></script>
</body>
</html>
